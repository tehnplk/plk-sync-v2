services:
  plk-sync-cron:
    build: .
    container_name: plk-sync-v2
    restart: unless-stopped
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
